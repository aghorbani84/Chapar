[package]
name = "chapar"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
keyring = "4.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "native-tls"] }
base64 = "0.23.0"
url = "2.5.8"

# Phase 1 will add these using official tooling to avoid guessing versions:
#
# cargo add reqwest --no-default-features --features json,rustls-tls
# cargo add rusqlite --features bundled
# cargo add keyring
#
# Planned dependency purposes:
# reqwest  -> HTTP execution from Rust only
# rusqlite -> SQLite persistence for collections, requests, environments, non-sensitive settings
# keyring  -> OS Keychain secret storage
